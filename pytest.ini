[pytest]
testpaths = tests
pythonpath = .
; Live Sarvam-API canaries and the Postgres backend suite are deselected by
; default; run them explicitly with:  python -m pytest -m live -q
;                                or:  python -m pytest -m postgres -q
addopts = -m "not live and not postgres"
markers =
    live: calls the real Sarvam API (costs credits; needs SARVAM_API_KEY)
    postgres: storage contract against real Postgres (needs VANI_TEST_DATABASE_URL; drops tables)
